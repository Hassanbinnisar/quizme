<!DOCTYPE html>

<head>

  <title>Quiz App</title>
  <link rel="stylesheet" href="style.css" />

</head>
<body>
  <div class="quiz-box">
    <h2 id="ques">Loading...</h2>
    
    <div class="options">
      <label><input type="radio" name="answer" id="inp1" value="" onclick="btnWork()"/> <span id="opt1">Option 1</span></label>
      <label><input type="radio" name="answer" id="inp2" value="" onclick="btnWork()"/> <span id="opt2">Option 2</span></label>
      <label><input type="radio" name="answer" id="inp3" value="" onclick="btnWork()"/> <span id="opt3">Option 3</span></label>
    </div>

    <button id="btn" onclick="checkAnswer()" disabled>Next</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
